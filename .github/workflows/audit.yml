name: Dependency audit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '41 6 * * 1'

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: npm audit (production)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
          cache: npm

      # Production dependencies are what ships in @maadb/core. Dev-only
      # advisories are tracked through Dependabot and do not fail this job.
      - name: Audit production dependencies
        # Retry so a registry outage does not fail the job; a real finding fails
        # all three attempts.
        run: |
          for attempt in 1 2 3; do
            npm audit --omit=dev --audit-level=moderate && exit 0
            sleep 30
          done
          exit 1

      - name: Verify registry signatures and provenance
        run: npm ci --ignore-scripts && npm audit signatures
