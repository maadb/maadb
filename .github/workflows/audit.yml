name: Dependency audit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '41 6 * * 1'

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: npm audit (production)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      # Production dependencies are what ships in @maadb/core. Dev-only
      # advisories are tracked through Dependabot and do not fail this job.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Verify registry signatures and provenance
        run: npm ci --ignore-scripts && npm audit signatures
