name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows in the matrix is load-bearing: the engine's canonical store is
        # host-edited markdown, so CRLF/path-separator regressions only surface
        # on a Windows runner.
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Type check
        run: npm run lint

      - name: Test
        run: npm test

      - name: Verify packed tarball contains the CLI entry
        run: node -e "const o=JSON.parse(require('child_process').execSync('npm pack --dry-run --json').toString()); const f=o[0].files.map(x=>x.path); if(!f.includes('dist/cli.js')||!f.includes('dist/engine.js')){console.error('tarball missing dist entries');process.exit(1)} console.log(f.length+' files, dist entries present')"
