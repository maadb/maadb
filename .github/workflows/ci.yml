name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly, so new advisories against the locked dependencies surface
    # without a push.
    - cron: '41 6 * * 1'

permissions:
  contents: read

# Pull requests share one group per branch, so a new push cancels the old run.
# Every other run gets its own group: GitHub drops a queued run when a newer one
# joins the same group, which would leave a main commit unchecked.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Docs-only means every changed file is under docs/ or is a top-level
      # Markdown file. Markdown elsewhere (test fixtures) is code.
      - name: Classify changed files
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base="" ;;
          esac
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" HEAD | grep -qvE '^(docs/|[^/]+\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # The test jobs always run so the required checks always report; their steps
  # skip on docs-only changes. A skipped matrix job would report under an
  # unexpanded name and leave the required checks pending.
  test:
    name: test (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows in the matrix is load-bearing: the engine's canonical store is
        # host-edited markdown, so CRLF/path-separator regressions only surface
        # on a Windows runner.
        os: [ubuntu-latest, windows-latest]
    env:
      CODE: ${{ needs.changes.outputs.code }}
    steps:
      - name: Docs-only change, skipping
        if: env.CODE != 'true'
        run: echo "Only docs changed; build and tests skipped."

      - name: Checkout
        if: env.CODE == 'true'
        uses: actions/checkout@v6

      - name: Set up Node
        if: env.CODE == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
          cache: npm

      - name: Install dependencies
        if: env.CODE == 'true'
        run: npm ci

      - name: Build
        if: env.CODE == 'true'
        run: npm run build

      - name: Type check
        if: env.CODE == 'true'
        run: npm run lint

      - name: Test
        if: env.CODE == 'true'
        run: npm test

      - name: Verify packed tarball contains the CLI entry
        if: env.CODE == 'true'
        run: node -e "const o=JSON.parse(require('child_process').execSync('npm pack --dry-run --json').toString()); const f=o[0].files.map(x=>x.path); if(!f.includes('dist/cli.js')||!f.includes('dist/engine.js')){console.error('tarball missing dist entries');process.exit(1)} console.log(f.length+' files, dist entries present')"

  audit:
    name: npm audit (production)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
          cache: npm

      # Production dependencies are what ships in @maadb/core. Dev-only
      # advisories are tracked through Dependabot and do not fail this job.
      - name: Audit production dependencies
        # Retry so a registry outage does not fail the job; a real finding fails
        # all three attempts.
        run: |
          for attempt in 1 2 3; do
            npm audit --omit=dev --audit-level=moderate && exit 0
            sleep 30
          done
          exit 1

      - name: Verify registry signatures and provenance
        run: npm ci --ignore-scripts && npm audit signatures
